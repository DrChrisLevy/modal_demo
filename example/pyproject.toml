[project]
name = "tiny-task-board"
version = "0.1.0"
description = "An ordinary Docker Compose app, independent of Modal"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "psycopg[binary]>=3.2,<4",
  "typesafe-sdk>=0.7.2,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "sorting"]
